name: Set Upstox Token

on:
  repository_dispatch:
    types: [set-token]

  schedule:
    - cron: "0 3 * * 1-5"

  workflow_dispatch:

jobs:
  set-token:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright pyotp requests python-dotenv
          playwright install chromium --with-deps

      - name: Refresh Upstox token into Supabase
        # The script logs in to Upstox and upserts the new token into the
        # Supabase `tokens` table, which the collector reads first
        # (cron_job.py → db.get_token).  No GitHub PAT is involved, so an
        # expired personal token can never break the daily refresh.
        env:
          UPSTOX_PHONE:       ${{ secrets.UPSTOX_PHONE }}
          UPSTOX_PIN:         ${{ secrets.UPSTOX_PIN }}
          UPSTOX_TOTP_SECRET: ${{ secrets.UPSTOX_TOTP_SECRET }}
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:       ${{ secrets.SUPABASE_KEY }}
          HEADLESS:           "true"
        run: python scripts/upstox_auth.py
